<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Github</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header>
        <div class="container">
            <img class="profile-avatar" src="https://via.placeholder.com/180x180" id="avatar" alt=".">
            <h1 class="profile-name" id="name">Gloria Oliveira</h1>
            <h2 class="profile-username" id="username">@gloriaoliveira</h2>
            <ul class="numbers">
                <li class="numbers-item">
                    <h4>Repositories</h4>
                    <span id="repos"></span>
                </li>
                <li class="numbers-item">
                    <h4>Followers</h4>
                    <span id="followers"></span>
                </li>
                <li class="numbers-item">
                    <h4>Following</h4>
                    <span id="following"></span>
                </li>
            </ul>
            <a href="#" id="link" class="profile-link">Ver no Github</a>
        </div>
    </header>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const nameElement = document.querySelector('#name');
            const usernameElement = document.querySelector('#username');
            const avatarElement = document.querySelector('#avatar');
            const reposElement = document.querySelector('#repos');
            const followersElement = document.querySelector('#followers');
            const followingElement = document.querySelector('#following');
            const linkElement = document.querySelector('#link');

            fetch('https://api.github.com/users/gloriaoliveira')
            .then(function(resposta) {
                return resposta.json(); 
            })
            .then(function(json) {
                nameElement.textContent = json.name;
                usernameElement.textContent = json.login;
                avatarElement.src = json.avatar_url;
                reposElement.textContent = json.public_repos;
                followersElement.textContent = json.followers;
                followingElement.textContent = json.following;
                linkElement.href = json.html_url;
            })
        })
    </script>
</body>
</html>
